server:
  port: 8081

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://${DB_HOST}:3306/lease?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
  jackson:
    time-zone: GMT+8

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      database: 0
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME}
    password: ${QQ_MAIL_AUTH_CODE}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


springdoc:
  default-flat-param-object: true


aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:disabled}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:disabled}
    endpoint: dysmsapi.aliyuncs.com

# 阿里云短信配置和代码保留，移动端登录已改用QQ SMTP邮箱验证码。


